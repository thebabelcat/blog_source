<article class="post-card">
    <div class="post-card-img">
        <img src="{{ SITEURL }}/images/{{ article.slug }}/featured.jpg" alt="{{ article.title }}">
    </div>
    <div class="post-card-body">
        <p class="post-card-date">{{ article.locale_date }}</p>
        <h3 class="post-card-title">
            <a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a>
        </h3>
        {% if article.summary %}<p class="post-card-summary">{{ article.summary|striptags }}</p>{% endif %}
    </div>
</article>
